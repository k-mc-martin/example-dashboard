env:
  contexts:
    - name: secdash
      urls: [http://127.0.0.1:5286]
  parameters:
    failOnError: true
    progressToStdout: true
jobs:
  - type: requestor
    requests:
      - url: http://127.0.0.1:5286/
        responseCode: 200
      - url: http://127.0.0.1:5286/api/dashboard
        responseCode: 401
      - url: http://127.0.0.1:5286/api/health
        responseCode: 401
      - url: http://127.0.0.1:5286/api/dashboard
        headers: [EMPLOYEE_COOKIE_HEADER]
        responseCode: 200
      - url: http://127.0.0.1:5286/api/health
        headers: [EMPLOYEE_COOKIE_HEADER]
        responseCode: 403
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: report.json
  - type: exitStatus
    parameters:
      errorLevel: High
      warnLevel: Medium
      okExitValue: 0
      warnExitValue: 2
      errorExitValue: 1
