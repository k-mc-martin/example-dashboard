name: secdash-simulation
services:
  suite-runner:
    build:
      context: ../..
      dockerfile: infra/suite/Dockerfile
    environment:
      SECDASH_DEMO_PORT: "${SECDASH_DEMO_PORT:-5286}"
    read_only: true
    init: true
    tmpfs: ['/tmp:mode=1777,size=192m']
    shm_size: 256m
    mem_limit: 950m
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [entry]
    volumes: [suite-jobs:/suite-jobs]
  providers:
    build:
      context: ../..
      dockerfile: infra/simulation/Dockerfile
    environment:
      SECDASH_PROVIDER_BIND: 0.0.0.0
    networks: [simulation]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  n8n:
    image: n8nio/n8n:2.41.3
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        n8n import:workflow --input=/opt/secdash-events.json
        n8n publish:workflow --id=SecDashSimulation
        exec n8n start
    configs:
      - source: workflow
        target: /opt/secdash-events.json
    tmpfs:
      - /home/node/.n8n:uid=1000,gid=1000,mode=0700
    environment:
      N8N_DISABLE_UI: "true"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
    depends_on: [providers]
    networks: [simulation]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  dashboard:
    build:
      context: ../..
      dockerfile: infra/dashboard/Dockerfile
    command: ["sh","-ec","export SECDASH_SESSION_SECRET=$$(node -e \"process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))\"); exec node server.js"]
    environment:
      SECDASH_DEMO_PORT: "${SECDASH_DEMO_PORT:-5286}"
      SECDASH_DEMO_MODE: "1"
      SECDASH_WORKSPACES: /demo/workspaces
      SECDASH_N8N_WEBHOOK: http://n8n:5678/webhook/secdash-events
    tmpfs:
      - /demo:uid=1000,gid=1000,mode=0700,size=192m
      - /tmp:mode=1777,size=64m
    read_only: true
    volumes: [suite-jobs:/suite-jobs]
    ports: ["127.0.0.1:${SECDASH_DEMO_PORT:-5286}:3000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [entry, simulation]
    depends_on:
      n8n:
        condition: service_healthy

configs:
  workflow:
    file: ../n8n/workflows/demo-events.json
networks:
  simulation:
    internal: true
  entry: {}

volumes:
  suite-jobs: {}
