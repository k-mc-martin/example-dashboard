name: secdash-n8n

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SECDASH_POSTGRES_DB:?Set a demo-only value}
      POSTGRES_USER: ${SECDASH_POSTGRES_USER:?Set a demo-only value}
      POSTGRES_PASSWORD: ${SECDASH_POSTGRES_PASSWORD:?Set a demo-only value}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  n8n:
    image: n8nio/n8n:2.41.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5778:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${SECDASH_POSTGRES_DB:?Set a demo-only value}
      DB_POSTGRESDB_USER: ${SECDASH_POSTGRES_USER:?Set a demo-only value}
      DB_POSTGRESDB_PASSWORD: ${SECDASH_POSTGRES_PASSWORD:?Set a demo-only value}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${SECDASH_N8N_ENCRYPTION_KEY:?Set a demo-only value}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_EDITOR_BASE_URL: http://localhost:5778
      N8N_WEBHOOK_URL: http://localhost:5778/
      TZ: ${TIMEZONE}
      GENERIC_TIMEZONE: ${TIMEZONE}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_MODE: regular
      EXECUTIONS_DATA_PRUNE: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${SECDASH_N8N_RUNNERS_AUTH_TOKEN:?Set a demo-only value}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  task-runners:
    image: n8nio/runners:2.41.3
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      # Keep the isolated JavaScript runner registered. The launcher's idle
      # shutdown/relaunch handoff can otherwise leave only a Python offer.
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "0"
      N8N_RUNNERS_AUTH_TOKEN: ${SECDASH_N8N_RUNNERS_AUTH_TOKEN:?Set a demo-only value}
      GENERIC_TIMEZONE: ${TIMEZONE}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - backend

volumes:
  n8n_data:
  postgres_data:

networks:
  backend:
    internal: true
