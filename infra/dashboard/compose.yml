name: secdash-dashboard
services:
  dashboard:
    build:
      context: ../..
      dockerfile: infra/dashboard/Dockerfile
    image: secdash-dashboard:private
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file: .env
    environment:
      SECDASH_DATABASE_PATH: /data/dashboard.sqlite
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:5286:3000"
    networks:
      access: {}
      backend:
        aliases: [dashboard]
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('node:http').get('http://127.0.0.1:3000/api/health',{headers:{host:'127.0.0.1:5286',authorization:'Bearer '+process.env.SECDASH_OPERATOR_TOKEN}},s=>{s.resume();process.exit(s.statusCode===200?0:1)});r.setTimeout(4000,()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
networks:
  access:
    internal: true
  backend:
    external: true
    name: secdash-n8n_backend
