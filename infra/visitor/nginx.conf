limit_req_zone $binary_remote_addr zone=dupdash_api:4m rate=15r/s;
limit_req_zone $binary_remote_addr zone=dupdash_launch:4m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=dupdash_conns:4m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name vps-ca027b84.vps.ovh.us mira.15-204-123-246.sslip.io theo.15-204-123-246.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vps-ca027b84.vps.ovh.us;
    ssl_certificate /etc/letsencrypt/live/dupdash-entry/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dupdash-entry/privkey.pem;
    include /etc/nginx/snippets/dupdash-proxy.conf;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mira.15-204-123-246.sslip.io theo.15-204-123-246.sslip.io;
    ssl_certificate /etc/letsencrypt/live/dupdash-members/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dupdash-members/privkey.pem;
    include /etc/nginx/snippets/dupdash-proxy.conf;
}
