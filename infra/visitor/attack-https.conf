server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name attack.15-204-123-246.sslip.io;
    ssl_certificate /etc/letsencrypt/live/secdash-attack/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secdash-attack/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /attack-site {
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_pass http://127.0.0.1:5286;
    }
    location / { return 404; }
}
