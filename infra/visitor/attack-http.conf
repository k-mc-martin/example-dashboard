# Bootstrap the isolated attack-site certificate using the existing Certbot account.
server {
    listen 80;
    listen [::]:80;
    server_name attack.15-204-123-246.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://$host$request_uri; }
}
