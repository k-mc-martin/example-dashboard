# Overlay for the isolated simulation stack on the public demo VPS.
services:
  suite-runner:
    restart: unless-stopped
    environment:
      SECDASH_REVISION: ${SECDASH_REVISION:?Set the deployed revision}
      SECDASH_BROWSER_TARGET: https://vps-ca027b84.vps.ovh.us
  dashboard:
    build:
      args:
        SECDASH_REVISION: ${SECDASH_REVISION:?Set the commit used to build the visitor image}
    restart: unless-stopped
    volumes:
      - /opt/secdash-evidence:/demo-evidence:ro
    environment:
      SECDASH_PUBLIC_HOST: vps-ca027b84.vps.ovh.us
      SECDASH_MEMBER_DOMAIN: 15-204-123-246.sslip.io
  n8n:
    restart: unless-stopped
  providers:
    restart: unless-stopped
