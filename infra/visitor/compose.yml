      DUPDASH_PUBLIC_HOST: vps-ca027b84.vps.ovh.us
      DUPDASH_MEMBER_DOMAIN: 15-204-123-246.sslip.io
  n8n:
    restart: unless-stopped
  providers:
    restart: unless-stopped
