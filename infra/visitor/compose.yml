# Overlay for the isolated simulation stack on the public demo VPS.
services:
  suite-runner:
    restart: unless-stopped
    # OVH resolves its own hostname to loopback locally. The browser needs the public TLS entry point.
    extra_hosts:
      - "vps-ca027b84.vps.ovh.us:15.204.123.246"
    environment:
      OPS_DASHBOARD_REVISION: ${OPS_DASHBOARD_REVISION:?Set the deployed revision}
      OPS_DASHBOARD_BROWSER_TARGET: https://vps-ca027b84.vps.ovh.us
  dashboard:
    build:
      args:
        OPS_DASHBOARD_REVISION: ${OPS_DASHBOARD_REVISION:?Set the commit used to build the visitor image}
    restart: unless-stopped
    volumes:
      - /opt/ops-dashboard-evidence:/demo-evidence:ro
    environment:
      OPS_DASHBOARD_PUBLIC_HOST: vps-ca027b84.vps.ovh.us
      OPS_DASHBOARD_MEMBER_DOMAIN: 15-204-123-246.sslip.io
  n8n:
    restart: unless-stopped
  providers:
    restart: unless-stopped
